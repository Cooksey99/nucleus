# License and advisory checks for the Phase 1 CI gate.
# The graph includes local and rag so the mistral.rs git deps are scanned.
# metal and cuda stay out: they need platform SDKs and are mutually exclusive.

[graph]
all-features = false
features = ["local", "rag", "experimental"]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # serde_yaml 0.9 pulls unmaintained unsafe-libyaml. Config parsing is replaced later.
    "RUSTSEC-2024-0449",
    # Transitive through mistral.rs / LanceDB. Not our crates to upgrade in Phase 1.
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0057",
    "RUSTSEC-2025-0119",
    # zip 8.6.0 advisories (archive extraction: symlink traversal and unsafe
    # permission/SUID handling). Pulled in by candle-core v0.11.0 (via mistral.rs),
    # which pins zip "^8.6.0", so we cannot bump to the patched 9.x without an
    # upstream candle/mistral.rs update. Not applicable to candle's usage: it only
    # reads model/GGUF archives it shipped, never untrusted user archives, and never
    # extracts symlinks or relies on extracted file modes.
    # TODO: remove these ignores once mistral.rs / candle-core allow zip >= 9.0.0.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "NCSA",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    { allow = ["MIT", "Apache-2.0"], crate = "core_detect" },
    { allow = ["MIT", "Apache-2.0"], crate = "serde_urlencoded" },
    { allow = ["Unlicense", "MIT"], crate = "same-file" },
    { allow = ["Unlicense", "MIT"], crate = "walkdir" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/EricLBuehler/mistral.rs.git",
    "https://github.com/huggingface/candle.git",
]
