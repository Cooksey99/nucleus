[workspace]
resolver = "2"
members = [
    "nucleus-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Andrew Cooksey"]
license = "MIT"
repository = "https://github.com/Cooksey99/nucleus"
homepage = "https://github.com/Cooksey99/nucleus"
keywords = ["ai", "llm", "developer-tools", "privacy", "local-ai"]
categories = ["development-tools", "api-bindings"]

[package]
name = "nucleus"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Privacy-first, modular AI engine for building customizable developer tooling"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
anyhow.workspace = true
async-trait.workspace = true
schemars.workspace = true
tracing = "0.1.43"
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs.git", rev = "2ed55750e24cc4cf0dfde2d4a2ad7352ed819d29", default-features = false }
lancedb = "0.26.2"
arrow-array = "57.2"
arrow-schema = "57.2"
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
tokenizers = { version = "0.22.2", features = ["onig"] }
walkdir = { version = "2.0", optional = true }
regex = { version = "1.10", optional = true }

[features]
default = ["std"]
std = ["dep:walkdir", "dep:regex"]
metal = ["mistralrs/metal"]
cuda = ["mistralrs/cuda"]

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tempfile = "3.13"
dirs = "6.0.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# Optimize heavy dependencies even in debug builds
# This keeps your code fast to compile while making inference fast
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[workspace.dependencies]
# Shared dependencies across workspace
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
anyhow = "1.0"
async-trait = "0.1"
schemars = "1.2.0"


