[workspace]
resolver = "2"
members = [
    "nucleus-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
authors = ["Andrew Cooksey"]
license = "MIT"
repository = "https://github.com/Cooksey99/nucleus"
homepage = "https://github.com/Cooksey99/nucleus"
keywords = ["ai", "llm", "developer-tools", "privacy", "local-ai"]
categories = ["development-tools", "api-bindings"]

[package]
name = "nucleus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Privacy-first, modular AI engine for building customizable developer tooling"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures = { workspace = true, optional = true }
anyhow.workspace = true
async-trait.workspace = true
schemars.workspace = true
tracing = "0.1.43"
reqwest = { workspace = true, optional = true }
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs.git", tag = "v0.9.4", default-features = false, optional = true }
lancedb = { version = "0.26.2", optional = true }
arrow-array = { version = "57.2", optional = true }
arrow-schema = { version = "57.2", optional = true }
walkdir = { version = "2.0", optional = true }
regex = { version = "1.10", optional = true }

[features]
default = ["hosted", "std"]
# Built-in file, search, and exec tools.
std = ["dep:walkdir", "dep:regex"]
# Hosted providers (Grok today). The default build.
hosted = ["dep:reqwest", "dep:futures"]
# In-process mistral.rs. Opt-in: it adds hundreds of crates.
local = ["dep:mistralrs"]
# LanceDB vector store. Implied by `rag` until Phase 4 adds a default store.
lancedb = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:futures"]
# Retrieval. Turns on local embeddings and, for now, LanceDB.
rag = ["local", "lancedb"]
# Reserved for the Phase 5 MCP client. Empty on purpose.
mcp = []
# Unofficial or unstable functionality. Grok account login lives here.
experimental = ["hosted"]
metal = ["local", "mistralrs/metal"]
cuda = ["local", "mistralrs/cuda"]

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
tempfile = "3.13"
dirs = "6.0.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# Examples that need a non-default feature are skipped unless it is enabled.
[[example]]
name = "one_shot"
required-features = ["hosted"]

[[example]]
name = "agent"
required-features = ["hosted"]

[[example]]
name = "local_hello"
required-features = ["local"]

# Optimize heavy dependencies even in debug builds.
# This keeps your code fast to compile while making inference fast.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[workspace.dependencies]
# Shared dependencies across workspace
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "form", "rustls", "charset"] }
futures = "0.3"
anyhow = "1.0"
async-trait = "0.1"
schemars = "1.2.0"

[package.metadata.docs.rs]
features = ["hosted", "std", "local", "rag", "experimental"]
rustdoc-args = ["--cfg", "docsrs"]
