[package]
name = "nucleus-core"
version.workspace = true
edition.workspace = true

[features]
default = []
# GPU acceleration for Apple Silicon (requires Metal toolchain)
metal = ["mistralrs/metal"]
# GPU acceleration for NVIDIA (requires CUDA)
cuda = ["mistralrs/cuda"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
anyhow.workspace = true
nucleus-plugin = { path = "../nucleus-plugin" }
# mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs.git", default-features = false }
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs.git", rev = "2ed55750e24cc4cf0dfde2d4a2ad7352ed819d29", default-features = false }
async-trait.workspace = true
tracing = "0.1.43"
lancedb = "0.26.2"
arrow-array = "57.2"
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
tokenizers = { version = "0.22.2", features = ["onig"] }
arrow-schema = "57.2"

[dev-dependencies]
tempfile = "3.13"
