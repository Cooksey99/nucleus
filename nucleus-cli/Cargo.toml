[package]
name = "nucleus-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Nucleus CLI: Grok account login and logout"
rust-version.workspace = true

[[bin]]
name = "nucleus"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
nucleus = { path = "..", default-features = false, features = ["experimental"] }
tokio.workspace = true
